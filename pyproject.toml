[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-mock-interviewer"
version = "0.1.0"
description = "A test-first mock interview application"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2,<2",
    "pydantic>=2.7,<3",
    "pypdf>=5,<7",
    "reportlab>=4,<5",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
    "pytest-cov>=5,<8",
]
voice-probe = [
    "mcp>=2.0,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["mock_interviewer"]

[tool.coverage.report]
show_missing = true
skip_covered = false
